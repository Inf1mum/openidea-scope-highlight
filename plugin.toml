id = "infimum.scope-highlight"
name = "Scope Highlight"
version = "0.1.0"
description = "Highlight the innermost enclosing bracket or tag pair at the caret, or dim everything outside it. Clears on Escape, document edits, or the Clear command."
authors = ["Inf1mum"]
license = "MIT"
engines.openidea = "^1.6"
wasm = "dist/plugin.wasm"
activation = ["on-event:document-changed"]
categories = ["tools"]

[capabilities]
required = ["project.read", "editor.read", "events", "storage"]

[[contributes.commands]]
id = "highlight"
title = "Scope Highlight: Highlight Current Scope"
when = "editorFocus"

[[contributes.commands]]
id = "dim"
title = "Scope Highlight: Dim Outside Current Scope"
when = "editorFocus"

[[contributes.commands]]
id = "clear"
title = "Scope Highlight: Clear Scope Highlighting"
